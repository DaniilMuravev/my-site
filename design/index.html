<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дизайн-работы · Даниил Муравьев</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F1EC;--ink:#161514;--muted:#7A766E;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 18px;z-index:5;font-size:15px}
.top a{color:var(--ink);text-decoration:none}.top span{color:var(--muted)}
.tunnel{height:900vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;perspective:900px;perspective-origin:50% 50%}
.card{position:absolute;left:50%;top:50%;width:min(56vw,620px);aspect-ratio:1.4/1;border-radius:14px;overflow:hidden;background:#E6E3DC;box-shadow:0 30px 80px rgba(0,0,0,.12);will-change:transform,opacity}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card figcaption{position:absolute;left:12px;bottom:10px;font-size:12px;background:rgba(243,241,236,.9);padding:4px 10px;border-radius:999px}
.end{position:absolute;inset:auto 0 12vh 0;text-align:center;font-size:15px;color:var(--muted);opacity:0;transition:opacity .4s}
.end a{color:var(--ink)}
@media (max-width:700px){ .card{width:78vw} }
@media (prefers-reduced-motion:reduce){ .tunnel{height:auto}.stage{position:static;height:auto;perspective:none;display:grid;gap:16px;padding:90px 16px}.card{position:relative;left:auto;top:auto;transform:none!important;opacity:1!important;width:100%}.end{position:static;opacity:1;padding:20px} }
</style>
</head>
<body>
<header class="top"><a href="/">← Даниил Муравьев</a><span>Дизайн-работы</span></header>
<div class="tunnel"><div class="stage" id="stage"></div></div>
<script>
const IMG=[
 ["https://framerusercontent.com/images/L2AlJ6jzOusF5w5K33suF0TcMs.png","Сайт врача"],
 ["https://framerusercontent.com/images/GM8fKAyNvvZKVdhPaReevUHQ8g.png","Сайт художника"],
 ["https://framerusercontent.com/images/1pZREefrhPfLMlxFVuzxV0Y.png","Сайт юриста"],
 ["https://framerusercontent.com/images/JSKV28BlNNguEa1vwZcU3L80tI.png","Сайт врача"],
 ["https://framerusercontent.com/images/vRu9ycqRPGI9dNFNq6sqatwkSo.png","Сайт художника"],
 ["https://framerusercontent.com/images/lp9ITrzeAX2iNt6DriJ8V8NX8.png","Сайт юриста"],
 ["https://framerusercontent.com/images/cMtk8elRZ5B8gbcxyhLPKaAjUg.png","Сайт художника"],
 ["https://framerusercontent.com/images/I1XqpRV6OxEVFk732aHxRPZJE.png","Сайт юриста"],
 ["https://framerusercontent.com/images/Z7Cz3wkLVgS3CyIAXGbdkigrM.png","Сайт врача"],
 ["https://framerusercontent.com/images/8YMu5W3bvPsMpoM9eLSNBrUTc.png","Сайт художника"],
 ["https://framerusercontent.com/images/8nDMZjKmh8k4uptylzj0LwvLt4.png","Сайт юриста"]
];
const stage=document.getElementById("stage"), GAP=1100, POS=[[-.22,-.12],[.2,.1],[-.16,.16],[.22,-.14],[0,0],[-.24,.06],[.18,.18],[-.1,-.18],[.24,0],[-.2,-.04],[.08,.14]];
const cards=IMG.map(([src,cap],i)=>{ const f=document.createElement("figure"); f.className="card"; f.style.margin="0";
  f.innerHTML=`<img src="${src}?scale-down-to=1024" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption>`; stage.appendChild(f); return f; });
const total=(IMG.length)*GAP;
function upd(){ const max=document.body.scrollHeight-innerHeight, p=max>0? scrollY/max : 0, cam=p*total;
  cards.forEach((c,i)=>{ const z=cam - i*GAP; const [px,py]=POS[i%POS.length];
    const op = z>500? Math.max(0,1-(z-500)/300) : z<-3200? 0 : Math.min(1,(z+3200)/1200);
    c.style.transform=`translate(-50%,-50%) translate3d(${px*innerWidth}px,${py*innerHeight}px,${z}px)`; c.style.opacity=op.toFixed(3); c.style.zIndex=String(1000+Math.round(z)); });
  }
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){ addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true}); addEventListener("resize",upd); upd(); }
</script>
</body>
</html>
